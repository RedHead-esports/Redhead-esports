let muted=false; try{ muted=localStorage.getItem("mute")==="1"; }catch(e){}
let ac=null;
function tone(f,d,type,v,at){ if(muted) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(at||0); o.type=type||"sine"; o.frequency.value=f; g.gain.setValueAtTime(v||.08,s); g.gain.exponentialRampToValueAtTime(.0001,s+d); o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+d); }catch(e){} }
const sfx={click:()=>tone(520,.07,"square",.03),ok:()=>{tone(523,.12,"triangle",.1,0);tone(659,.12,"triangle",.1,.12);tone(784,.3,"triangle",.1,.24);},err:()=>tone(180,.28,"sawtooth",.07)};
$("snd").textContent=muted?"🔇":"🔊";
$("snd").onclick=()=>{ muted=!muted; try{localStorage.setItem("mute",muted?"1":"0");}catch(e){} $("snd").textContent=muted?"🔇":"🔊"; };
document.addEventListener("click",e=>{ if(e.target.closest("button,.lk a")&&e.target.id!=="snd") sfx.click(); });

let be=null, user=null, rows=[], mine=null, lastMsg=null;

function applyLang(){
  document.documentElement.lang = L==="hi"?"hi":"en";
  document.querySelectorAll("[data-i]").forEach(e=>{ e.innerHTML = t(e.dataset.i); });
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  $("dt").textContent = new Date().toLocaleDateString(loc[L],{weekday:"long",day:"numeric",month:"long"})+" · 8:00 PM";
  if(user) $("who").textContent = t("as")+" "+(user.name||user.email||"Player")+(user.isOwner?" · "+t("adm"):"");
  render();
}
$("lang").onclick = e => { const l=e.target.dataset.l; if(!l) return; L=l; try{localStorage.setItem("lang",l);}catch(x){} applyLang(); };

if(LOGO_URL){ $("logo").innerHTML='<img alt="Redhead eSports" src="'+esc(LOGO_URL)+'">'; }

function render(){
  const d = dkey();
  const teams = rows.filter(x=>x.date===d).sort((a,b)=>(a.at||0)-(b.at||0));
  mine = user ? teams.find(x=>x.id===user.id+"_"+d) || null : null;
  const conf = teams.filter(x=>x.paid);
  $("left").textContent = Math.max(0,MAX-conf.length);
  $("fill").style.width = Math.min(100,conf.length/MAX*100)+"%";
  $("list").innerHTML = conf.length ? conf.map((x,i)=>
    '<div class="row"><span>'+(i+1)+'. <b>'+esc(x.team)+'</b> <span class="mu">'+esc(x.ign)+'</span></span><span><span class="pill '+(x.paid?"ok":"")+'">'+(x.paid?t("paidS"):t("pendS"))+'</span>'+
    '</span></div>'
  ).join("") : '<div class="mu">'+t("none")+'</div>';
  $("payS").classList.toggle("hide",!mine);
  $("payStatus").textContent = mine ? (mine.paid?t("paid"):t("pend")) : "";
  $("payStatus").className = "pill"+(mine&&mine.paid?" ok":"");
  $("regBtn").textContent = mine?t("upd"):t("regBtn");
  if(mine && !$("team").value){ $("team").value=mine.team; $("ign").value=mine.ign; }
  const full = conf.length>=MAX && !mine;
  $("regBtn").disabled = full;
  if(full) say("regMsg",t("full"),"er"); else if($("regMsg").dataset.full){ say("regMsg","",""); }
  $("regMsg").dataset.full = full?"1":"";
  const isA=!!(user&&user.isOwner);
  $("adm").classList.toggle("hide",!isA);
  if(isA){
    $("aReg").textContent=teams.length; $("aConf").textContent=conf.length; $("aCol").textContent="₹"+(conf.length*234);
    $("alist").innerHTML = teams.length ? teams.map((x,i)=>'<div class="row"><span>'+(i+1)+'. <b>'+esc(x.team)+'</b> <span class="mu">'+esc(x.ign)+'</span></span><span><span class="pill '+(x.paid?"ok":"")+'">'+(x.paid?t("paidS"):t("pendS"))+'</span><button class="sm" data-p="'+esc(x.id)+'" data-v="'+(x.paid?0:1)+'">'+(x.paid?t("unm"):t("mark"))+'</button><button class="sm" data-d="'+esc(x.id)+'">✕</button></span></div>').join("") : '<div class="mu">'+t("none")+'</div>';
  }
}
function say(id,txt,cls){ const m=$(id); m.textContent=txt; m.className="msg "+cls; }

$("list").onclick = $("alist").onclick = async e => {
  const p=e.target.dataset.p, d=e.target.dataset.d;
  try{
    if(p) await be.patch(p,{paid:e.target.dataset.v==="1"});
    if(d && confirm(t("delq"))) await be.del(d);
  }catch(err){ alert(t("err")+(err.message||err.code)); }
};

$("regBtn").onclick = async () => {
  const team=$("team").value.trim(), ign=$("ign").value.trim(), uid=$("uid").value.trim(), mob=$("mob").value.replace(/\D/g,"");
  if(!team||!ign||!/^\d{6,14}$/.test(uid)||mob.length<10||mob.length>13){ say("regMsg",t("bad"),"er"); sfx.err(); return; }
  try{
    const d=dkey();
    await be.save(user.id+"_"+d,{team,ign,date:d,paid:mine?!!mine.paid:false,at:mine?mine.at:Date.now()});
    say("regMsg",t("ok"),"go");
    sfx.ok();
    openWA();
  }catch(err){ say("regMsg",t("err")+(err.message||err.code),"er"); }
};

function openWA(){
  const msg = t("wa").replace("{t}",$("team").value.trim()||(mine&&mine.team)||"").replace("{i}",$("ign").value.trim()||(mine&&mine.ign)||"").replace("{u}",$("uid").value.trim()||"-").replace("{m}",$("mob").value.trim()||"-");
  const url="https://wa.me/"+OWNER_WA+"?text="+encodeURIComponent(msg);
  const w=window.open(url,"_blank");
  if(!w){ try{ location.href=url; }catch(e){} }
}
$("waBtn").onclick = openWA;
$("loginBtn").onclick = async () => { try{ await be.login(); }catch(err){ say("loginMsg",t("err")+(err.message||err.code),"er"); } };
$("outBtn").onclick = () => be.logout();
$("cpy").onclick = async () => {
  const d=dkey(), c=rows.filter(x=>x.date===d&&x.paid).sort((a,b)=>(a.at||0)-(b.at||0));
  const txt="Redhead eSports – "+d+"\n"+c.map((x,i)=>(i+1)+". "+x.team+" ("+x.ign+")").join("\n");
  try{ await navigator.clipboard.writeText(txt); $("cpy").textContent=t("copied"); setTimeout(()=>{$("cpy").textContent=t("aCopy");},1500); }catch(e){ prompt("Copy:",txt); }
};

function onUser(u){
  user=u;
  $("loginCard").classList.toggle("hide",!!u);
  $("regCard").classList.toggle("hide",!u);
  applyLang();
}

/* ====== BACKENDS ====== */
async function claudeBackend(){
  if(!window.claude) return null;
  const U=await claude.use("user"), db=await claude.use("db");
  if(!U||!db) return {off:true};
  const me=await U.me(), id=await U.id(), owner=await U.isOwner();
  return { auth(cb){ cb({id,name:me.name,email:me.email,isOwner:owner}); },
    login(){}, logout(){}, teams(cb,er){ return db.collection("teams").onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),er); },
    save:(i,d)=>db.collection("teams").doc(i).set(d), patch:(i,d)=>db.collection("teams").doc(i).update(d), del:i=>db.collection("teams").doc(i).delete() };
}
async function supabaseBackend(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY) return null;
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm");
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const fail = r => { if(r.error) throw r.error; return r; };
  return {
    auth(cb){
      const f = s => { const u=s&&s.user; cb(u?{id:u.id,name:(u.user_metadata&&u.user_metadata.full_name)||"",email:u.email,isOwner:u.email===OWNER_EMAIL}:null); };
      sb.auth.getSession().then(r=>f(r.data.session));
      sb.auth.onAuthStateChange((_e,s)=>f(s));
    },
    login:()=>sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href.split("#")[0]}}),
    logout:()=>sb.auth.signOut(),
    teams(cb,er){
      const load=async()=>{ const r=await sb.from("teams").select("*").eq("date",dkey()); if(r.error) er(r.error); else cb(r.data); };
      load(); sb.channel("teams").on("postgres_changes",{event:"*",schema:"public",table:"teams"},load).subscribe(); setInterval(load,20000);
    },
    save:async(id,d)=>fail(await sb.from("teams").upsert({id,...d})),
    patch:async(id,d)=>fail(await sb.from("teams").update(d).eq("id",id)),
    del:async id=>fail(await sb.from("teams").delete().eq("id",id))
  };
}

applyLang();
try{
  be = await claudeBackend() || await supabaseBackend();
  if(!be || be.off){ say("loginMsg",t("needLogin"),"er"); }
  else { be.auth(onUser); be.teams(s=>{rows=s;render();},e=>say("regMsg",t("err")+(e.code||""),"er")); }
}catch(e){ say("loginMsg",t("err")+(e.message||""),"er"); }
</script></body></html>
